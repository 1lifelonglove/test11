<!DOCTYPE html>
<!--
============================================================================
 旋转太极罗盘控件 · 初级原型（单文件版）
----------------------------------------------------------------------------
 【功能】
   中心太极 + 多层同心圆环，每层环可独立控制：转向（顺/逆）、转速、
   偏移角、显示/隐藏、锁定（固定不转）、编辑文字、删除、添加新环。
   支持撤销/重做（Ctrl+Z / Ctrl+Y，最多 50 步）、全屏、顶栏/侧栏收起。

 【文件结构】
   1. <style>  样式（CSS 变量定义调色板 → 布局 → 各组件）
   2. <body>   页面结构（顶栏 → 画布舞台 → 拖拽条 → 右侧操作台）
   3. script 标签内是全部逻辑，按功能分块：
      - 数据模型（THEMES 主题表 / PALETTE 配色 / 状态变量）
      - 转速映射（滑杆非线性）
      - 环的创建 addRing / 预设环
      - 布局计算 resize / layoutRings（环半径、内外相接）
      - 绘制 drawBackground / drawRing / drawYinYang
      - 主循环 frame（角度推进 + 重绘）
      - 撤销/重做（快照式）
      - 面板渲染 renderPanel（右侧卡片列表）
      - 交互（画布点击选中 / 全局按钮 / 快捷键 / 面板折叠拖拽 / 提示条 / 顶栏 / 全屏）

 【常见修改入口】
   · 改默认环（层数/顺序/速度/方向）  → 搜 “预设：主流罗盘”
   · 改某主题的文字                   → 搜 “const THEMES”
   · 改环的文字颜色池                 → 搜 “const PALETTE”
   · 改环间距 / 是否内外相接           → 搜 “firstGap / ringGap”
   · 改环上文字大小                    → 搜 “fontSize”（drawRing 内）
   · 改撤销步数上限                    → 搜 “HISTORY_LIMIT”
============================================================================
-->
<html lang="zh-CN" data-page-node-id="YKcOQwmNm74mM09gndxA6d">
<head data-page-node-id="WzGcWSE7modKnB17DbXlwO">
<meta charset="utf-8" data-page-node-id="vjKakfFyZ4nG0EIJbKaJLL" />

<title>旋转太极罗盘控件 · 初级原型</title>
<style>
  /* ================= 主题变量：统一调色板（改颜色先改这里） ================= */
  :root{
    --bg1:#0a0c12;      /* 页面底色（深） */
    --bg2:#11151f;
    --panel:#151a26;    /* 侧栏背景 */
    --panel2:#1c2230;   /* 卡片背景 */
    --line:#2a3245;     /* 边框/分隔线 */
    --txt:#dfe5f1;      /* 正文文字 */
    --muted:#8a93a8;    /* 次要文字 */
    --gold:#e7c873;     /* 主强调色（金） */
    --gold2:#f3dfa0;
    --accent:#6c9bff;   /* 悬停强调（蓝） */
    --danger:#e0705f;   /* 危险（删除） */
    --ok:#5bd0a4;       /* 成功提示 */
  }

  /* ================= 全局与整体布局 ================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--txt);
    background:radial-gradient(1200px 800px at 30% 20%, #182032, var(--bg1));
    overflow:hidden;   /* 桌面端整页不滚动，滚动只发生在侧栏内部 */
  }
  #app{display:flex;flex-direction:column;height:100vh;}   /* 顶栏 + 主区 纵向排列 */

  /* ================= 顶栏 ================= */
  header{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;  /* 按钮多时允许换行，避免被挤出可视区 */
    padding:12px 20px;border-bottom:1px solid var(--line);
    background:rgba(21,26,38,.6);backdrop-filter:blur(6px);
  }
  header .btn{white-space:nowrap;flex-shrink:0;}
  header h1{font-size:16px;font-weight:600;letter-spacing:.5px;white-space:nowrap;}
  header h1 .gold{color:var(--gold);}
  header .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .spacer{flex:1;}   /* 弹簧：把后面的按钮推到右侧 */

  /* 顶栏「转速上限」数字框 */
  .maxset{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .maxset input{
    width:82px;background:var(--bg1);border:1px solid var(--line);color:var(--gold);
    padding:6px 8px;border-radius:7px;font-size:12px;text-align:right;outline:none;font-variant-numeric:tabular-nums;
  }
  .maxset input:focus{border-color:var(--gold);}
  .maxset .unit{font-size:10px;}

  /* ================= 通用按钮 ================= */
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    padding:7px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;
    transition:.15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--accent);color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a2410;border:0;font-weight:600;}   /* 主按钮（金色） */
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost:hover{color:#fff;}
  .btn svg{width:15px;height:15px;}

  /* ================= 主区：画布舞台 ================= */
  main{flex:1;display:flex;min-height:0;}   /* 横向：舞台 + 拖拽条 + 侧栏 */

  #stage{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    min-width:0;background:#0a0c12;   /* 与画布渐变外缘同色，避免收起面板时露底色差 */
  }
  canvas{display:block;}

  /* ================= 左下角操作提示条（可隐藏 + 可恢复） ================= */
  #hint{
    position:absolute;bottom:12px;left:20px;font-size:11.5px;color:var(--muted);
    background:rgba(15,18,28,.7);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;line-height:1.7;max-width:280px;
  }
  #hint b{color:var(--gold);}
  /* 提示条：可隐藏 + 恢复按钮 */
  #hint .hint-x{
    position:absolute;top:5px;right:6px;cursor:pointer;color:var(--muted);
    font-size:12px;line-height:1;border:0;background:transparent;padding:2px 4px;border-radius:5px;
  }
  #hint .hint-x:hover{color:#fff;background:rgba(255,255,255,.08);}
  #hintShow{
    position:absolute;bottom:12px;left:20px;display:none;z-index:4;
    background:rgba(15,18,28,.7);border:1px solid var(--line);color:var(--muted);
    font-size:11.5px;padding:5px 10px;border-radius:8px;cursor:pointer;
  }
  #hintShow:hover{color:#fff;border-color:var(--accent);}

  /* 左上角「已选中」信息条：默认隐藏，不再显示（保留节点备用） */
  #selinfo{
    position:absolute;top:14px;left:20px;font-size:12px;color:var(--gold);
    background:rgba(15,18,28,.7);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;display:none !important;
  }

  /* ================= 顶栏可收缩 + 收起后的「⌄ 顶栏」按钮 ================= */
  header.collapsed{display:none;}
  #headerShow{
    position:fixed;top:8px;right:14px;left:auto;z-index:40;display:none;cursor:pointer;
    background:rgba(15,18,28,.78);border:1px solid var(--line);color:var(--muted);
    font-size:11.5px;padding:5px 10px;border-radius:8px;
    transition:right .18s ease;   /* right 由 JS 按操作台宽度动态计算，过渡使其平滑滑动 */
  }
  #headerShow:hover{color:#fff;border-color:var(--accent);}
  /* 顶栏收起时，把画布右上「面板」按钮下移，避免与「展开顶栏」重叠 */
  body.hdr-collapsed #panelToggle{top:52px;}

  /* ================= 右侧操作台（可折叠 / 可拖拽调宽） ================= */
  aside{
    width:340px;flex-shrink:0;border-left:1px solid var(--line);
    background:var(--panel);overflow-y:auto;padding:16px 16px 40px;
    transition:width .18s ease,padding .18s ease;   /* 宽度过渡动画（JS 会在动画结束后重算画布） */
  }
  aside::-webkit-scrollbar{width:8px}
  aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  /* 右侧面板：可折叠 / 可拖拽调宽 */
  aside.collapsed{width:0;padding-left:0;padding-right:0;border-left:0;overflow:hidden;}
  #resizer{
    flex:0 0 5px;width:5px;cursor:col-resize;background:transparent;   /* 舞台与侧栏之间的拖拽分隔条 */
    transition:background .15s;
  }
  #resizer:hover,#resizer.dragging{background:linear-gradient(180deg,rgba(231,200,115,.55),rgba(231,200,115,.12));}
  aside.collapsed + #resizer,#resizer.hidden{display:none;}
  #panelToggle{
    position:absolute;top:12px;right:14px;z-index:6;   /* 画布右上角「▤ 面板」按钮 */
    background:rgba(15,18,28,.78);border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:5px 9px;border-radius:8px;cursor:pointer;
  }
  #panelToggle:hover{color:#fff;border-color:var(--accent);}

  /* ================= 卡片折叠（每张环卡片的 ▾ 按钮） ================= */
  .card-body{overflow:hidden;}
  .ringcard.folded .card-body{display:none;}
  .iconbtn.fold .chev{display:inline-block;transition:transform .15s;}
  .ringcard.folded .iconbtn.fold .chev{transform:rotate(-90deg);}

  /* ================= 侧栏区块标题（添加圆环 / 圆环列表） ================= */
  .section-title{
    font-size:11px;color:var(--muted);letter-spacing:1.5px;margin:6px 0 10px;
    text-transform:uppercase;display:flex;align-items:center;gap:8px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}   /* 标题后的细线 */

  /* ================= 「添加圆环」表单 ================= */
  #addForm{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .field select,.field input[type=number]{
    width:100%;background:var(--bg1);border:1px solid var(--line);color:var(--txt);
    padding:7px 9px;border-radius:7px;font-size:12.5px;outline:none;
  }
  .row{display:flex;gap:8px;}   /* 转速/方向/段数 三栏一行 */
  .row .field{flex:1;margin-bottom:0;}
  .segcount-wrap{position:relative;}

  /* ================= 圆环卡片列表 ================= */
  #ringList{display:flex;flex-direction:column;gap:12px;}
  .ringcard{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;transition:.15s;position:relative;
  }
  /* 转速数字框（隐藏原生上下箭头） */
  .speed-num{
    width:62px;background:var(--bg1);border:1px solid var(--line);color:var(--gold);
    padding:4px 6px;border-radius:6px;font-size:11px;text-align:right;outline:none;
    font-variant-numeric:tabular-nums;
  }
  .speed-num:focus{border-color:var(--gold);}
  .speed-row .unit{font-size:10px;color:var(--muted);margin-left:2px;}
  .speed-num::-webkit-outer-spin-button,.speed-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .speed-num{-moz-appearance:textfield;appearance:textfield;}
  .font-num{
    width:62px;background:var(--bg1);border:1px solid var(--line);color:var(--gold);
    padding:4px 6px;border-radius:6px;font-size:11px;text-align:right;outline:none;
    font-variant-numeric:tabular-nums;
  }
  .font-num:focus{border-color:var(--gold);}
  .font-num::-webkit-outer-spin-button,.font-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .font-num{-moz-appearance:textfield;appearance:textfield;}

  .ringcard.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}   /* 选中描金边 */
  .ringcard.hidden{opacity:.5;}   /* 已隐藏的环：卡片半透明 */

  /* 中心太极卡片：深渐变底 + “核心”角标 */
  .ringcard.centercard{background:linear-gradient(180deg,#20263a,#181d2b);border-color:#3a4258;}
  .ringcard.centercard .card-name::after{
    content:"核心";font-size:9px;color:#241f0e;background:var(--gold);
    border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle;font-weight:700;
  }
  .center-swatch{background:conic-gradient(#f5f5f2 0 50%, #15161a 0 100%) !important;}   /* 太极色块：黑白各半 */

  /* 卡片头部：色块 + 名称 + 操作按钮 */
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
  .card-name{font-size:13px;font-weight:600;}
  .card-name small{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px;}
  .card-head .spacer{flex:1;}
  .iconbtn{
    border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;
    display:inline-flex;transition:.15s;
  }
  .iconbtn:hover{color:#fff;background:rgba(255,255,255,.06);}
  .iconbtn.del:hover{color:var(--danger);}
  .iconbtn svg{width:16px;height:16px;}

  /* 方向切换（左=逆时针 / 右=顺时针） */
  .dir-toggle{
    display:flex;background:var(--bg1);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:9px;
  }
  .dir-toggle button{
    flex:1;border:0;background:transparent;color:var(--muted);padding:6px 0;font-size:12px;cursor:pointer;transition:.15s;
  }
  .dir-toggle button.on{background:var(--accent);color:#fff;font-weight:600;}
  .dir-toggle button.on.l{background:linear-gradient(135deg,#5ba0ff,#3f7fe0);}              /* 逆时针选中=蓝 */
  .dir-toggle button.on.r{background:linear-gradient(135deg,#e7a74c,#d9863f);color:#2a1c08;} /* 顺时针选中=橙 */

  /* 转速行（滑杆 + 数字框） */
  .speed-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .speed-row label{font-size:11px;color:var(--muted);white-space:nowrap;}
  input[type=range]{
    flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:4px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer;
    border:2px solid #2a2410;
  }
  .speed-val{font-size:11px;color:var(--gold);min-width:34px;text-align:right;font-variant-numeric:tabular-nums;}

  .empty{color:var(--muted);font-size:12px;text-align:center;padding:20px 0;border:1px dashed var(--line);border-radius:10px;}

  /* ================= 右下角 toast 提示 ================= */
  #toast{
    position:fixed;bottom:22px;right:22px;background:#1c2230;border:1px solid var(--ok);
    color:var(--ok);padding:9px 15px;border-radius:9px;font-size:12.5px;opacity:0;
    transform:translateY(8px);transition:.25s;z-index:50;
  }
  #toast.show{opacity:1;transform:none;}

  /* ================= 窄屏适配：侧栏移到下方 ================= */
  @media(max-width:900px){
    main{flex-direction:column;}
    aside{width:100%;border-left:0;border-top:1px solid var(--line);max-height:46vh;}
    #stage{min-height:50vh;}
    body{overflow:auto;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const TWO_PI = Math.PI*2;

  /* ---------------- 数据模型（主流罗盘：从内到外） ---------------- */
  /*
   * THEMES：内置主题表。每个主题 = { 显示名, 固定段数, 文字标签 }
   *   segs 为 null 表示段数由用户输入（scale/blank）或由文字数量决定（custom）。
   *   新增主题步骤：① 这里加一条 ② 顶栏 <select id="themeSel"> 加 <option>
   *   ③ 如需特殊绘制（大字/纯色）在 drawRing() 里按 theme 分支处理。
   */
  const THEMES = {
    // —— 八卦：两种公认卦序务必区分（先天为体、后天为用）——
    trigram:  { name:"先天八卦（伏羲·8段）", segs:8,  labels:["乾","兑","离","震","巽","坎","艮","坤"] },   // 先天数序：乾1兑2离3震4巽5坎6艮7坤8
    trigramHou:{ name:"后天八卦（文王·8段）", segs:8,  labels:["坎","坤","震","巽","乾","兑","艮","离"] },   // 后天数序（洛书）：坎1坤2震3巽4乾6兑7艮8离9
    trigramSym:{ name:"八卦符号（先天·8段）", segs:8,  labels:["☰","☱","☲","☳","☴","☵","☶","☷"] },   // 白色大字；顺序与先天八卦一致（见 drawRing 的 isSym 分支）
    // —— 干支 / 方位 ——
    stems:    { name:"天干（10段）", segs:10, labels:["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"] },
    branches: { name:"地支（12段）", segs:12, labels:["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"] },
    mountains:{ name:"二十四山（24段）", segs:24, labels:["壬","子","癸","丑","艮","寅","甲","卯","乙","辰","巽","巳","丙","午","丁","未","坤","申","庚","酉","辛","戌","乾","亥"] },
    // —— 历法 / 天文 ——
    terms:    { name:"二十四节气（24段）",segs:24, labels:["立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒"] },
    mansions: { name:"二十八宿（28段）", segs:28, labels:["角","亢","氐","房","心","尾","箕","斗","牛","女","虚","危","室","壁","奎","娄","胃","昴","毕","觜","参","井","鬼","柳","星","张","翼","轸"] },
    // —— 易学扩展 ——
    gua64:    { name:"六十四卦（文王序·64段）", segs:64, labels:["乾","坤","屯","蒙","需","讼","师","比","小畜","履","泰","否","同人","大有","谦","豫","随","蛊","临","观","噬嗑","贲","剥","复","无妄","大畜","颐","大过","坎","离","咸","恒","遁","大壮","晋","明夷","家人","睽","蹇","解","损","益","夬","姤","萃","升","困","井","革","鼎","震","艮","渐","归妹","丰","旅","巽","兑","涣","节","中孚","小过","既济","未济"] },
    gua64Sym: { name:"六十四卦符号（文王序·64段）", segs:64, labels:["䷀","䷁","䷂","䷃","䷄","䷅","䷆","䷇","䷈","䷉","䷊","䷋","䷌","䷍","䷎","䷏","䷐","䷑","䷒","䷓","䷔","䷕","䷖","䷗","䷘","䷙","䷚","䷛","䷜","䷝","䷞","䷟","䷠","䷡","䷢","䷣","䷤","䷥","䷦","䷧","䷨","䷩","䷪","䷫","䷬","䷭","䷮","䷯","䷰","䷱","䷲","䷳","䷴","䷵","䷶","䷷","䷸","䷹","䷺","䷻","䷼","䷽","䷾","䷿"] },   // Unicode 六十四卦块即按文王序：䷀乾…䷿未济
    // —— 通用 ——
    scale:    { name:"数字刻度", segs:null },   // 标签 = 0..N-1
    blank:    { name:"空白刻度", segs:null },   // 只有刻度线，无文字
    custom:   { name:"自定义",   segs:null },   // 用户自填文字，数量即段数
  };
  /*
   * PALETTE：环文字配色池（主色 + 浅色），按环的创建顺序循环取用；
   * 同一环内相邻段交替用 color0/color1（见 drawRing）。
   */
  const PALETTE = [
    ["#e7c873","#f3dfa0"], // gold
    ["#6c9bff","#a9c4ff"], // blue
    ["#5bd0a4","#9effd8"], // teal
    ["#e0705f","#ffb3a6"], // red
    ["#b48ce0","#dcc4ff"], // purple
    ["#f08fb4","#ffcfdf"], // pink
    ["#e7a74c","#ffd79a"], // orange
    ["#8fc7e8","#c5e6ff"], // ice
  ];

  /* ---------------- 全局状态 ---------------- */
  const center = { angle:0, speed:26, dir:1, visible:true, lock:false };   // 中心太极（angle 单位：度；dir 1=顺 -1=逆）
  let rings = [];            // 所有圆环（数组顺序 = 从内到外）
  let selectedId = null;     // 当前选中的环 id，'center' 表示中心太极
  let playing = true;        // 全局播放/暂停
  let booted = false;        // 启动完成标记：启动前的初始化静默期不触发自动存盘

  /* ---------------- 本地存档（localStorage） ----------------
   * 目标：用户调整圆环/太极后自动保存到浏览器本地，下次打开按存档还原。
   * 关键点：
   *   · 只存「配置」不存「运行期字段」（_inner/_outer/_mid/_thick/_rot 每帧重算）；
   *   · 只存静态配置（转速/方向/文字/颜色/可见性/锁定/偏移角），不存实时旋转角度；
   *   · 读写全程 try/catch，隐私模式或 file:// 不支持时静默降级，不影响使用。
   */
  const STORAGE_KEY = 'taichi-ring-control:v1';
  /* 统一序列化：history 的 snapshot() 与 localStorage 的 saveState() 共用，避免重复结构 */
  function collectState(){
    return {
      center:{ speed:center.speed, dir:center.dir, visible:center.visible, lock:center.lock, folded:!!center.folded },
      rings: rings.map(r=>({
        id:r.id, theme:r.theme, segments:r.segments, labels:r.labels.slice(), labels2: Array.isArray(r.labels2)? r.labels2.slice():null, fontSize: r.fontSize||0,
        name:r.name, color0:r.color0, color1:r.color1, speed:r.speed, dir:r.dir,
        angle:r.angle, visible:r.visible, lock:!!r.lock, folded:!!r.folded
      })),
      selectedId, speedMax:SPEED_MAX, globalFontScale:GLOBAL_FONT_SCALE
    };
  }
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({v:1, ...collectState()}));
    }catch(e){ /* localStorage 不可用（隐私模式/file:// 限制）时忽略 */ }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const d = JSON.parse(raw);
      if(!d || !Array.isArray(d.rings)) return false;
      if(d.center){
        center.speed = (d.center.speed!=null)? d.center.speed : center.speed;
        center.dir   = (d.center.dir!=null)?   d.center.dir   : center.dir;
        center.visible = (d.center.visible!==undefined)? d.center.visible : center.visible;
        center.lock    = (d.center.lock!=null)? d.center.lock : center.lock;
        center.folded  = !!d.center.folded;
      }
      rings = d.rings.map(r=>({
        id: r.id || ('r'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
        theme: r.theme,
        segments: r.segments,
        labels: Array.isArray(r.labels)? r.labels.slice() : [],
        labels2: Array.isArray(r.labels2)? r.labels2.slice():null,
        fontSize: (r.fontSize>0)? r.fontSize : 0,
        name: r.name || '',
        color0: r.color0 || '#e7c873', color1: r.color1 || '#f3dfa0',
        speed: (r.speed!=null)? r.speed : 24,
        dir: (r.dir!=null)? r.dir : 1,
        angle: (r.angle!=null)? r.angle : 0,
        visible: (r.visible!==undefined)? r.visible : true,
        lock: !!r.lock,
        folded: !!r.folded
      }));
      if(d.selectedId!==undefined) selectedId = d.selectedId;
      if(d.speedMax){ SPEED_MAX = d.speedMax; const mi=document.getElementById('maxSpeedInput'); if(mi) mi.value=d.speedMax; }
      if(typeof d.globalFontScale==='number'){
        GLOBAL_FONT_SCALE = d.globalFontScale;
        const gf=document.getElementById('globalFontRange'); if(gf) gf.value=GLOBAL_FONT_SCALE;
        const gfv=document.getElementById('globalFontVal'); if(gfv) gfv.textContent=Math.round(GLOBAL_FONT_SCALE*100)+'%';
      }
      return true;
    }catch(e){ return false; }
  }

  /* 转速上限与滑杆非线性映射：低速精细、高速可达很高（幂指数 2.2） */
  let SPEED_MAX = 3600;              // °/s，滑杆量程上限（可在顶部「转速上限」自定义）
  let GLOBAL_FONT_SCALE = 1;         // 全局字号倍率（顶栏滑块控制，统一缩放所有环文字，1=100%）
  const SPEED_HARD_MAX = 200000;     // 数值框硬上限
  function speedToSlider(v){ return Math.round(100*Math.pow(Math.max(0,Math.min(v,SPEED_MAX))/SPEED_MAX, 1/2.2)); }   // 速度 → 滑杆值(0~100)
  function sliderToSpeed(s){ return Math.round(SPEED_MAX*Math.pow(s/100, 2.2)); }                                     // 滑杆值 → 速度

  /* 生成某环的文字标签数组（按主题与段数） */
  function makeLabels(theme, segs, customLabels){
    if(theme==='custom') return (customLabels && customLabels.length)? customLabels.slice() : ['自定义'];
    if(theme==='scale'){
      return Array.from({length:segs},(_,i)=> String(i));
    }
    if(theme==='blank') return Array.from({length:segs},()=> '');
    const t = THEMES[theme];
    return t.labels.slice(0, segs);
  }
  /* 解析用户输入的文字：支持逗号/空格/顿号/分号/斜杠/竖线分隔 */
  function parseLabels(text){
    return String(text||'').split(/[,，、;；\/|\s]+/).map(s=>s.trim()).filter(Boolean);
  }
  function nextColor(){
    return PALETTE[rings.length % PALETTE.length];   // 按已创建环数循环取色
  }

  /*
   * addRing：创建一层环并加入 rings（追加到数组末尾 = 最外层）。
   * opts: {theme, name, segs, color, speed, dir, customText}
   * silent: 初始化期为 true（最后统一 renderPanel），否则立即刷新面板。
   * 注意：_inner/_outer/_mid/_thick/_rot 等运行期字段不在这里初始化，
   *       每帧由 layoutRings()/frame() 重算。
   */
  function addRing(opts, silent){
    const theme = opts.theme;
    let customLabels = null;
    if(theme==='custom'){
      customLabels = parseLabels(opts.customText!=null ? opts.customText : (document.getElementById('customLabels')?document.getElementById('customLabels').value:''));
      if(customLabels.length===0) customLabels = ['自','定','义'];
    }
    let segs = opts.segs;
    if(THEMES[theme].segs) segs = THEMES[theme].segs;     // 固定段数的主题强制覆盖
    if(theme==='custom') segs = customLabels.length;      // 自定义：文字数量即段数
    if(!segs) segs = parseInt(document.getElementById('seg').value,10)||12;
    const c = opts.color||nextColor();
    const ring = {
      id: 'r'+Date.now()+'_'+Math.random().toString(36).slice(2,6),   // 时间戳+随机串，保证唯一
      theme,
      segments: segs,
      labels: makeLabels(theme, segs, customLabels),
      labels2: Array.isArray(opts.labels2)? opts.labels2.slice() : null,   // 可选第二行文字（上下两行）
      fontSize: (typeof opts.fontSize==='number' && opts.fontSize>0)? opts.fontSize : 0,   // 0=自动
      name: opts.name || THEMES[theme].name + '('+segs+')',
      color0:c[0], color1:c[1],        // 相邻段交替使用的两种文字色
      speed: opts.speed!=null?opts.speed:24,
      dir: opts.dir!=null?opts.dir:1,
      angle: Math.random()*360,        // 初始随机偏角，避免所有环起点重合
      visible:true, lock:false,
    };
    rings.push(ring);
    selectedId = ring.id;
    if(!silent) renderPanel();   // 初始化期静默，最后统一渲染，避免 TDZ
    return ring;
  }

  /* 默认预设：主流罗盘从内到外（太极→八卦→八卦符号→地支→二十四节气→二十八宿→刻度）
   * 修改默认环：改这里即可（顺序即层级，speed 单位 °/s，dir 1=顺 -1=逆） */
  function seedDefaultRings(){
    addRing({theme:'trigramSym',name:'内 · 八卦符号（先天序）', speed:14, dir: 1}, true);   // 太极外第一圈：八卦符号 ☰☱☲☳☴☵☶☷（先天序，非文字）
    addRing({theme:'trigramHou',name:'后天八卦',                speed:18, dir:-1}, true);   // 文王序（洛书）：坎坤震巽乾兑艮离
    addRing({theme:'stems',     name:'天干',                    speed:22, dir: 1}, true);
    addRing({theme:'branches',  name:'地支',                    speed:10, dir:-1}, true);
    addRing({theme:'mountains', name:'二十四山',                 speed:12, dir: 1}, true);
    addRing({theme:'terms',     name:'二十四节气',               speed: 8, dir:-1}, true);
    addRing({theme:'mansions',  name:'二十八宿',                 speed:12, dir: 1}, true);
    addRing({theme:'gua64',     name:'外 · 六十四卦',            speed: 6, dir:-1, segs:64}, true);
    addRing({theme:'gua64Sym',  name:'最外 · 六十四卦符号',       speed: 6, dir:-1, segs:64}, true);
  }
  /* 初始化：优先还原本地存档，无存档才植入默认预设 */
  function initRings(){
    if(loadState()) return;     // 命中存档：直接还原，跳过默认预设
    seedDefaultRings();
  }
  initRings();

  /* ---------------- 布局计算 ---------------- */
  let W=0,H=0,dpr=1;
  /* resize：画布像素尺寸跟随容器，并处理高分屏（dpr）缩放 */
  function resize(){
    const rect = cv.parentElement.getBoundingClientRect();
    dpr = window.devicePixelRatio||1;
    W = rect.width; H = rect.height;
    cv.width = W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  /*
   * layoutRings：每帧重算所有环的半径（_inner/_outer/_mid/_thick）。
   * 半径结构（由内向外）：
   *   圆心 → 中心太极(centerR) → firstGap → 环1 … 环N（相邻环间隔 ringGap）→ outerMargin → 画布边缘
   * 环厚 = (可用总半径 - 间隙总和) / 环数，因此加环后所有环等比例变薄。
   */
  function layoutRings(){
    const cx=W/2, cy=H/2;
    const baseR = Math.min(W,H)*0.44;      // 罗盘外半径（留一点画布边距）
    const centerR = baseR*0.15;            // 中心太极半径
    // 中心太极与第一圈同样内外相接：-1px 轻微重叠，与环间隙保持一致
    const firstGap = -1;
    // 环与环内外相接：留 -1px 让相邻环边界轻微重叠，既无缝隙也不会露底色（可调：0=刚好相切，正数=留缝）
    const ringGap = -1;
    const outerMargin = baseR*0.015;       // 最外环到画布边缘的余量
    const total = baseR - centerR - firstGap - outerMargin;   // 所有环可用的总径向长度
    const n = rings.length;
    const thickness = n>0 ? (total - ringGap*(n-1))/n : 0;    // 环等厚
    rings.forEach((r,i)=>{
      r._inner = centerR + firstGap + i*(thickness+ringGap);
      r._outer = r._inner + thickness;
      r._mid = (r._inner+r._outer)/2;
      r._thick = thickness;
    });
    return {cx,cy,baseR,centerR,thickness};
  }

  /* ---------------- 绘制 ---------------- */
  /* 背景：中心向外的深色径向渐变 + 6 圈极淡参考圆环 */
  function drawBackground(cx,cy,baseR){
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*1.08);
    g.addColorStop(0,'#131826');
    g.addColorStop(1,'#0a0c12');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    // faint concentric guides
    ctx.save();
    ctx.strokeStyle='rgba(120,140,190,0.05)';
    ctx.lineWidth=1;
    for(let i=1;i<=6;i++){
      ctx.beginPath();ctx.arc(cx,cy,baseR*i/6,0,TWO_PI);ctx.stroke();
    }
    ctx.restore();
  }

  /*
   * drawRing：绘制单层环。顺序：
   *   ① 环形底色 + 内/外边界白线  ② 每段的放射分隔线  ③ 每段文字  ④ 选中高亮虚线
   * 文字朝向：径向排列，字顶朝外、字底朝圆心（随环旋转，全环方向一致，无翻转）。
   * 特殊分支 isSym（trigramSym / gua64Sym 主题）：白色大字、字号按环厚与格宽取最大。
   */
  function drawRing(ring,cx,cy,geo){
    if(!ring.visible) return;
    const inner=ring._inner, outer=ring._outer, thick=ring._thick;
    const rMid=(inner+outer)/2;
    const rot = ring._rot; // radians

    ctx.save();
    // annulus base fill（外圈与内圈之间 moveTo 抬笔，避免在正东角度0处产生一条固定连线）
    ctx.beginPath();
    ctx.arc(cx,cy,outer,0,TWO_PI);
    ctx.moveTo(cx+inner,cy);
    ctx.arc(cx,cy,inner,0,TWO_PI,true);
    ctx.fillStyle='rgba(255,255,255,0.03)';
    ctx.fill();
    // 边界线：每条只画一次（相邻环共享边界由外层环 outer 画，消除双线；最内环补一次 inner 贴中心）
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=1;
    if(ring===rings[0]){                       // 仅最内环画内边界（其内无相邻环）
      ctx.beginPath();ctx.arc(cx,cy,inner,0,TWO_PI);ctx.stroke();
    }
    ctx.beginPath();ctx.arc(cx,cy,outer,0,TWO_PI);ctx.stroke();   // 本环外边界 = 与下一环共享边界，画一次

    const N = ring.segments;
    const segAng = TWO_PI/N;                 // 每段弧度
    const isSym = ring.theme==='trigramSym' || ring.theme==='gua64Sym';
    // 第二行文字：可选 labels2（长度=段数），实现"一个环内上下两行"
    const has2 = !isSym && Array.isArray(ring.labels2) && ring.labels2.length===N && ring.labels2.some(s=>s && String(s).trim()!=='');
    // 字号 / 行半径：两行时上下分布于环带内，单行时居中；符号环始终单行放大
    // 每环可手动覆盖字号：ring.fontSize>0 时直接用指定值，覆盖自动计算（0/空=自动）
    const fzOverride = (typeof ring.fontSize==='number' && ring.fontSize>0) ? ring.fontSize : 0;
    let fontSize, rRow1, rRow2;
    if(isSym){
      fontSize = fzOverride || Math.max(12, Math.min(thick*0.92, rMid*segAng*0.8));
      rRow1 = rMid; rRow2 = rMid;
    } else if(has2){
      fontSize = fzOverride || Math.max(7, Math.min(thick*0.36, 11));   // 每行略小，给中间留分隔线空间
      rRow1 = inner + thick*0.27;                          // 上行（近内边界）
      rRow2 = inner + thick*0.73;                          // 下行（近外边界）
    } else {
      fontSize = fzOverride || Math.max(9, Math.min(thick*0.62, 13));
      rRow1 = rMid; rRow2 = rMid;
    }
    fontSize = Math.max(6, fontSize * GLOBAL_FONT_SCALE);   // 全局字号倍率：统一缩放所有环（含手动覆盖的环）
    // 双行环：上下两行之间加一条圆弧分隔线（位于环带正中 radius = inner + thick*0.5）
    if(has2){
      ctx.strokeStyle='rgba(255,255,255,0.45)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy, inner + thick*0.5, 0, TWO_PI); ctx.stroke();
    }
    ctx.font = (isSym? 'normal ' : (ring.theme==='terms'? 'normal ':'600 '))+fontSize+'px "Segoe UI Symbol","Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    // 在段中央、指定半径处绘制一行文字（字顶朝外，随环旋转，不翻转）
    function drawLabel(txt, ang, rad){
      const lx = cx + Math.cos(ang)*rad;
      const ly = cy + Math.sin(ang)*rad;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(ang + Math.PI/2);   // 字形"下方"对准圆心
      ctx.fillStyle = '#ffffff';                                  // 全部文字纯白
      ctx.shadowColor = 'rgba(255,255,255,.5)';                   // 白色柔光，保证深底可读
      ctx.shadowBlur = 4;
      ctx.fillText(txt, 0, 0);
      ctx.shadowBlur=0;
      ctx.restore();
    }

    for(let k=0;k<N;k++){
      const base = rot + k*segAng;
      // spoke line at start of segment（每段起点的放射分隔线，白色）
      const sAng = base;
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(sAng)*inner, cy+Math.sin(sAng)*inner);
      ctx.lineTo(cx+Math.cos(sAng)*outer, cy+Math.sin(sAng)*outer);
      ctx.stroke();
      const midAng = rot + (k+0.5)*segAng;   // 文字位于段中央
      const l1 = ring.labels[k];
      if(l1) drawLabel(l1, midAng, rRow1);    // 上行
      const l2 = has2 ? ring.labels2[k] : null;
      if(l2) drawLabel(l2, midAng, rRow2);    // 下行（第二行）
    }

    // 选中高亮（画布可见反馈）：内外各一圈金色虚线
    if(ring.id===selectedId){
      ctx.strokeStyle='rgba(231,200,115,0.95)';
      ctx.lineWidth=2;
      ctx.setLineDash([7,6]);
      ctx.beginPath();ctx.arc(cx,cy,outer+2.5,0,TWO_PI);ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,inner-2.5,0,TWO_PI);ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  /*
   * drawYinYang：绘制中心太极（经典画法）。
   * 大圆填白 → 右半圆填黑 → 上/下两个小半圆（鱼头）→ 鱼眼 → 白色描边。
   * 外层有金色光晕；整体随 center._rot 旋转。
   */
  function drawYinYang(cx,cy,R){
    if(!center.visible) return;
    // luminous halo
    const halo=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*1.5);
    halo.addColorStop(0,'rgba(231,200,115,0.18)');
    halo.addColorStop(1,'rgba(231,200,115,0)');
    ctx.fillStyle=halo;
    ctx.beginPath();ctx.arc(cx,cy,R*1.5,0,TWO_PI);ctx.fill();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(center._rot);
    const w='#f5f5f2', b='#15161a';
    // white base circle
    ctx.beginPath();ctx.arc(0,0,R,0,TWO_PI);ctx.fillStyle=w;ctx.fill();
    // black right half
    ctx.beginPath();ctx.arc(0,0,R,-Math.PI/2,Math.PI/2,false);ctx.fillStyle=b;ctx.fill();
    // white top semicircle (head)
    ctx.beginPath();ctx.arc(0,-R/2,R/2,0,TWO_PI);ctx.fillStyle=w;ctx.fill();
    // black bottom semicircle (head)
    ctx.beginPath();ctx.arc(0,R/2,R/2,0,TWO_PI);ctx.fillStyle=b;ctx.fill();
    // dots
    ctx.beginPath();ctx.arc(0,-R/2,R/6,0,TWO_PI);ctx.fillStyle=b;ctx.fill();
    ctx.beginPath();ctx.arc(0,R/2,R/6,0,TWO_PI);ctx.fillStyle=w;ctx.fill();
    // crisp outer ring
    ctx.beginPath();ctx.arc(0,0,R,0,TWO_PI);ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=Math.max(1,R*0.02);ctx.stroke();
    ctx.restore();
  }

  /* ---------------- 主循环 ---------------- */
  let lastTs=null;
  /*
   * frame：requestAnimationFrame 每帧执行。
   * ① 按帧间隔推进各环/太极角度（速度°/s × dt）；锁定环不转；暂停时 dt 置 0。
   * ② 重算布局 → 重绘：背景 → 各环 → 中心太极。
   */
  function frame(ts){
    if(!lastTs) lastTs=ts;
    let dt=(ts-lastTs)/1000;
    lastTs=ts;
    if(dt>0.1) dt=0.1;            // 切后台回来帧间隔过大，钳制避免跳变
    const f = playing ? dt : 0;

    // advance angles (deg->rad)
    center._rot = (center.angle*Math.PI/180);
    if(playing){ center.angle += center.speed*center.dir*f; }
    rings.forEach(r=>{
      r._rot = r.angle*Math.PI/180;
      if(playing && !r.lock){ r.angle += r.speed*r.dir*f; } // 锁定环 = 固定不转
    });

    const geo = layoutRings();
    const {cx,cy,baseR,centerR}=geo;
    drawBackground(cx,cy,baseR);
    rings.forEach(r=> drawRing(r,cx,cy,geo));
    drawYinYang(cx,cy,centerR);
    requestAnimationFrame(frame);
  }

  /* ---------------- 历史快照（撤销/重做，回档） ---------------- */
  /*
   * 快照式撤销：修改前 pushHistory() 存一份 JSON 快照，undo/redo 栈上限 50。
   * 埋点规则：按钮类在点击时存；滑杆在 pointerdown/keydown 存（一次拖动只存一条）；
   *           数字框在 focus 时存。任何新的修改入口都要遵守同样规则，否则撤销会吞并多步。
   */
  const HISTORY_LIMIT=50;
  let undoStack=[], redoStack=[];
  // 复用 collectState()（与 saveState 同一序列化），不再重复结构；不存 center.angle（实时旋转，撤销无需回退）
  function snapshot(){
    return JSON.stringify(collectState());
  }
  function pushHistory(){                 // 在每次"修改前"调用
    undoStack.push(snapshot());
    if(undoStack.length>HISTORY_LIMIT) undoStack.shift();
    redoStack.length=0;                   // 新操作清空重做栈
    updateUndoBtns();
  }
  function restore(json){
    const s=JSON.parse(json);
    Object.assign(center,s.center);
    rings=s.rings;                        // 运行期字段(_inner等)由 layoutRings 每帧重算，无需恢复
    selectedId=s.selectedId;
    if(s.speedMax){ SPEED_MAX=s.speedMax; const mi=document.getElementById('maxSpeedInput'); if(mi) mi.value=s.speedMax; }
    updateCenterBtn();
    renderPanel();
  }
  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
    updateUndoBtns();
    toast('已撤销 ↩');
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
    updateUndoBtns();
    toast('已重做 ↪');
  }
  /* 同步撤销/重做按钮的可用状态（顶栏按钮已移除，此函数仅在按钮存在时生效） */
  function updateUndoBtns(){
    const u=document.getElementById('btnUndo'), r=document.getElementById('btnRedo');
    if(u) u.disabled = undoStack.length===0;
    if(r) r.disabled = redoStack.length===0;
  }

  /* ---------------- 面板渲染 ---------------- */
  const listEl=document.getElementById('ringList');
  const selinfoEl=document.getElementById('selinfo');

  function esc(s){return s;}   // 预留：文本转义（当前未启用）

  /*
   * renderPanel：整列重建右侧卡片（中心太极卡 + 每个环一张卡）。
   * 每次状态变更后整列重建并重新绑定事件——简单直接，状态与 DOM 不会失同步。
   * 卡片内所有修改入口都要先 pushHistory()（按钮点击）或按埋点规则（滑杆/数字框）。
   */
  function renderPanel(){
    listEl.innerHTML='';
    // 中心太极控制卡（始终在最上方）
    listEl.appendChild(buildCenterCard());
    if(rings.length===0){
      const empty=document.createElement('div');
      empty.className='empty'; empty.textContent='还没有圆环，从上方添加一层吧';
      listEl.appendChild(empty);
    }
    // draw from outermost (reverse) so list shows outer first? keep inner-first order（列表与环层级一致：内→外）
    rings.forEach(r=>{
      const card=document.createElement('div');
      card.className='ringcard'+(r.id===selectedId?' selected':'')+(r.visible?'':' hidden');
      card.dataset.id=r.id;
      card.innerHTML=`
        <div class="card-head">
          <span class="swatch" style="background:${r.color0}"></span>
          <div class="card-name">${r.name}<small>${r.segments} 段 · 半径${Math.round(r._outer||0)}</small></div>
          <div class="spacer"></div>
          <button class="iconbtn" data-act="edit" title="编辑该环文字">✎</button>
          <button class="iconbtn" data-act="edit2" title="编辑该环第二行文字（上下两行）">↕</button>
          <button class="iconbtn" data-act="lock" title="固定圆环（暂停旋转）">${r.lock?'🔒':'🔓'}</button>
          <button class="iconbtn" data-act="vis" title="显示/隐藏">${r.visible?'👁':'🚫'}</button>
          <button class="iconbtn" data-act="del" title="删除圆环">✕</button>
          <button class="iconbtn fold" data-act="fold" title="折叠/展开"><span class="chev">▾</span></button>
        </div>
        <div class="card-body">
        <div class="dir-toggle">
          <button data-dir="-1" class="${r.dir===-1?'on l':''}">⟲ 逆时针 · 左</button>
          <button data-dir="1" class="${r.dir===1?'on r':''}">⟳ 顺时针 · 右</button>
        </div>
        <div class="speed-row">
          <label>转速</label>
          <input type="range" class="spd-range" min="0" max="100" step="1" value="${speedToSlider(r.speed)}">
          <input type="number" class="speed-num" min="0" max="${SPEED_HARD_MAX}" step="1" value="${r.speed}">
          <span class="unit">°/s</span>
        </div>
        <div class="speed-row" style="justify-content:flex-end;margin-bottom:0">
          <label style="margin-right:6px">偏移角(°)</label>
          <input type="range" class="ang-range" min="0" max="360" step="1" value="${Math.round(((r.angle%360)+360)%360)}" style="width:120px;flex:none">
        </div>
        <div class="speed-row" style="justify-content:flex-end;margin-bottom:0">
          <label style="margin-right:6px">字号(px)</label>
          <input type="number" class="font-num" min="6" max="60" step="1" value="${r.fontSize||''}" placeholder="自动">
        </div>
        </div>
      `;
      listEl.appendChild(card);

      // ---- 卡片事件绑定 ----
      // 点卡片空白处选中该环（点按钮/输入框不触发）
      card.addEventListener('click',(e)=>{
        if(e.target.closest('[data-act]')||e.target.closest('[data-dir]')||e.target.tagName==='INPUT') return;
        selectedId=r.id; renderPanel();
      });
      // 方向切换
      card.querySelector('.dir-toggle').addEventListener('click',(e)=>{
        const b=e.target.closest('[data-dir]'); if(!b)return;
        if(r.dir!==parseInt(b.dataset.dir,10)) pushHistory();
        r.dir=parseInt(b.dataset.dir,10); renderPanel();
      });
      // 转速：滑杆（非线性映射）与数字框双向同步
      const spd=card.querySelector('.spd-range');
      const num=card.querySelector('.speed-num');
      spd.addEventListener('pointerdown',pushHistory);           // 拖动开始前存档
      spd.addEventListener('keydown',pushHistory);              // 键盘调滑杆
      spd.addEventListener('input',()=>{ r.speed=sliderToSpeed(parseInt(spd.value,10)); num.value=r.speed; });
      num.addEventListener('focus',pushHistory);                // 输入前存档
      num.addEventListener('input',()=>{ let v=parseInt(num.value,10); if(isNaN(v))v=0; v=Math.max(0,Math.min(SPEED_HARD_MAX,v)); r.speed=v; spd.value=speedToSlider(v); });
      // 偏移角
      const ang=card.querySelector('.ang-range');
      if(ang){ ang.value = ((r.angle%360)+360)%360;
        ang.addEventListener('pointerdown',pushHistory);
        ang.addEventListener('keydown',pushHistory);
        ang.addEventListener('input',()=>{ r.angle=parseInt(ang.value,10); }); }
      // 字号（0/空 = 自动；>0 覆盖自动计算）— 不入历史（纯视图微调），focus 时存档一次
      const fnum=card.querySelector('.font-num');
      if(fnum){
        fnum.addEventListener('focus',pushHistory);
        fnum.addEventListener('input',()=>{ let v=parseInt(fnum.value,10); r.fontSize = (isNaN(v)||v<=0)?0:Math.max(6,Math.min(60,v)); });
        fnum.addEventListener('blur',()=>{ if(!r.fontSize) fnum.value=''; });
      }
      // ▾ 折叠卡片（不入历史——纯视图状态）
      card.querySelector('[data-act=fold]')?.addEventListener('click',(e)=>{ e.stopPropagation(); r.folded=!r.folded; card.classList.toggle('folded',!!r.folded); });
      if(r.folded) card.classList.add('folded');
      // 显示/隐藏、锁定、删除、编辑文字
      card.querySelector('[data-act=vis]').addEventListener('click',(e)=>{ e.stopPropagation(); pushHistory(); r.visible=!r.visible; renderPanel(); });
      card.querySelector('[data-act=lock]').addEventListener('click',(e)=>{ e.stopPropagation(); pushHistory(); r.lock=!r.lock; renderPanel(); });
      card.querySelector('[data-act=del]').addEventListener('click',(e)=>{ e.stopPropagation(); deleteRing(r.id); });
      card.querySelector('[data-act=edit]').addEventListener('click',(e)=>{
        e.stopPropagation();
        const input = window.prompt('编辑该环文字（用逗号/空格分隔，数量即段数）：', r.labels.join(','));
        if(input==null) return;
        const labs = parseLabels(input);
        if(labs.length===0) return;
        pushHistory();
        r.labels = labs; r.segments = labs.length; r.theme='custom';   // 编辑过文字的环降级为 custom 主题
        renderPanel();
        toast('已更新该环文字（'+labs.length+' 段）');
      });
      // 第二行文字编辑（上下两行）：不降级主题，仅设置/清空 labels2
      card.querySelector('[data-act=edit2]')?.addEventListener('click',(e)=>{
        e.stopPropagation();
        const cur = Array.isArray(r.labels2)? r.labels2.join(',') : '';
        const input = window.prompt('编辑该环【第二行】文字（逗号/空格分隔，将自动对齐到 '+r.segments+' 段）：', cur);
        if(input==null) return;
        let labs2 = parseLabels(input);
        pushHistory();
        if(labs2.length===0){ r.labels2=null; }
        else { labs2 = labs2.slice(0, r.segments); while(labs2.length<r.segments) labs2.push(''); r.labels2 = labs2; }
        renderPanel();
        toast(r.labels2? ('已更新第二行（'+r.labels2.length+' 段）') : '已清空第二行');
      });
    });

    // 画布左上角选中信息 + 面板滚动到选中项（selinfo 默认被 CSS 隐藏，仅滚动同步生效）
    let infoText=null;
    if(selectedId==='center'){
      infoText='已选中：中心太极 · '+(center.dir>0?'顺时针·右':'逆时针·左')+' '+center.speed+'°/s'+(center.visible?'':'（已隐藏）');
    } else {
      const sel = rings.find(r=>r.id===selectedId);
      if(sel) infoText='已选中：'+sel.name+' · '+(sel.dir>0?'顺时针·右':'逆时针·左')+' '+sel.speed+'°/s'+(sel.visible?'':'（已隐藏）');
    }
    if(infoText){
      selinfoEl.style.display='block';
      selinfoEl.textContent=infoText;
      const selCard=listEl.querySelector('.ringcard.selected');
      if(selCard) selCard.scrollIntoView({behavior:'smooth',block:'nearest'});
    } else {
      selinfoEl.style.display='none';
    }
    if(booted) saveState();      // 任何面板刷新（即任何配置修改）后自动存盘
  }

  /* 中心太极控制卡（结构与环卡片一致，无编辑/删除按钮） */
  function buildCenterCard(){
    const card=document.createElement('div');
    card.className='ringcard centercard'+(selectedId==='center'?' selected':'')+(center.visible?'':' hidden');
    card.dataset.id='center';
    card.innerHTML=`
      <div class="card-head">
        <span class="swatch center-swatch"></span>
        <div class="card-name">中心太极<small>Yin-Yang</small></div>
        <div class="spacer"></div>
        <button class="iconbtn" data-act="cvis" title="显示/隐藏">${center.visible?'👁':'🚫'}</button>
        <button class="iconbtn fold" data-act="fold" title="折叠/展开"><span class="chev">▾</span></button>
      </div>
      <div class="card-body">
      <div class="dir-toggle">
        <button data-dir="-1" class="${center.dir===-1?'on l':''}">⟲ 逆时针 · 左</button>
        <button data-dir="1" class="${center.dir===1?'on r':''}">⟳ 顺时针 · 右</button>
      </div>
      <div class="speed-row">
        <label>转速</label>
        <input type="range" class="spd-range" min="0" max="100" step="1" value="${speedToSlider(center.speed)}">
        <input type="number" class="speed-num" min="0" max="${SPEED_HARD_MAX}" step="1" value="${center.speed}">
        <span class="unit">°/s</span>
      </div>
      <div class="speed-row" style="justify-content:flex-end;margin-bottom:0">
        <label style="margin-right:6px">偏移角(°)</label>
        <input type="range" class="ang-range" min="0" max="360" step="1" value="${Math.round(((center.angle%360)+360)%360)}" style="width:120px;flex:none">
      </div>
      </div>
    `;
    card.addEventListener('click',(e)=>{
      if(e.target.closest('[data-act]')||e.target.closest('[data-dir]')||e.target.tagName==='INPUT') return;
      selectedId='center'; renderPanel();
    });
    card.querySelector('.dir-toggle').addEventListener('click',(e)=>{
      const b=e.target.closest('[data-dir]'); if(!b)return;
      if(center.dir!==parseInt(b.dataset.dir,10)) pushHistory();
      center.dir=parseInt(b.dataset.dir,10); renderPanel();
    });
    const spd=card.querySelector('.spd-range');
    const num=card.querySelector('.speed-num');
    spd.addEventListener('pointerdown',pushHistory);
    spd.addEventListener('keydown',pushHistory);
    spd.addEventListener('input',()=>{ center.speed=sliderToSpeed(parseInt(spd.value,10)); num.value=center.speed; });
    num.addEventListener('focus',pushHistory);
    num.addEventListener('input',()=>{ let v=parseInt(num.value,10); if(isNaN(v))v=0; v=Math.max(0,Math.min(SPEED_HARD_MAX,v)); center.speed=v; spd.value=speedToSlider(v); });
    const ang=card.querySelector('.ang-range');
    if(ang){ ang.addEventListener('pointerdown',pushHistory);
      ang.addEventListener('keydown',pushHistory);
      ang.addEventListener('input',()=>{ center.angle=parseInt(ang.value,10); }); }
    card.querySelector('[data-act=cvis]').addEventListener('click',(e)=>{ e.stopPropagation(); toggleCenterVisible(); renderPanel(); });
    card.querySelector('[data-act=fold]')?.addEventListener('click',(e)=>{ e.stopPropagation(); center.folded=!center.folded; card.classList.toggle('folded',!!center.folded); });
    if(center.folded) card.classList.add('folded');
    return card;
  }

  function toggleCenterVisible(){
    center.visible=!center.visible;
    updateCenterBtn();
  }
  /* 同步顶栏「中心太极」按钮文案与透明度 */
  function updateCenterBtn(){
    btnCenterToggle.textContent= center.visible?'⚙ 中心太极':'⚙ 中心隐藏';
    btnCenterToggle.style.opacity=center.visible?'1':'.6';
  }

  /* 删除环：先存档；删除后选中项回退到最外层 */
  function deleteRing(id){
    const idx=rings.findIndex(r=>r.id===id);
    if(idx<0)return;
    pushHistory();
    rings.splice(idx,1);
    if(selectedId===id) selectedId=rings.length?rings[rings.length-1].id:null;
    renderPanel();
    toast('已删除圆环');
  }

  /* canvas click -> select ring（按点到圆心的距离命中：先判中心，再由外向内判环） */
  cv.addEventListener('click',(e)=>{
    const rect=cv.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    const geo=layoutRings();
    const d=Math.hypot(x-geo.cx,y-geo.cy);
    // 点中中心太极
    if(d<=geo.centerR){ selectedId='center'; renderPanel(); return; }
    // check rings from outermost inward（相邻环边界有 1px 重叠，先判外层）
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i];
      if(d>=r._inner && d<=r._outer){ selectedId=r.id; renderPanel(); return; }
    }
  });

  /* ---------------- 全局控制 ---------------- */
  const btnPlay=document.getElementById('btnPlay');
  function togglePlay(){
    playing=!playing;
    btnPlay.textContent= playing?'⏸ 暂停':'▶ 播放';
  }
  btnPlay.addEventListener('click',togglePlay);

  // 复位：所有角度归零、全部显示，中心恢复默认转速/方向（保留各环已设转速与方向）
  document.getElementById('btnResetAll').addEventListener('click',()=>{
    pushHistory();
    center.angle=0; center.speed=26; center.dir=1; center.visible=true;
    rings.forEach(r=>{ r.angle=0; r.visible=true; });
    updateCenterBtn();
    renderPanel();
  });

  const btnCenterToggle=document.getElementById('btnCenterToggle');
  btnCenterToggle.addEventListener('click',()=>{ pushHistory(); toggleCenterVisible(); renderPanel(); });

  /* 恢复默认布局：清除本地存档并重新植入出厂预设（renderPanel 内会自动把默认布局存盘） */
  document.getElementById('btnResetDefault').addEventListener('click',()=>{
    if(!window.confirm('恢复默认布局会清除本地保存的所有修改，确定继续？')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    rings.length=0;
    selectedId='center';
    seedDefaultRings();
    center.speed=26; center.dir=1; center.visible=true; center.lock=false; center.angle=0;
    updateCenterBtn();
    renderPanel();
    toast('已恢复默认布局');
  });

  /* 「＋ 添加到最外层」 */
  document.getElementById('btnAdd').addEventListener('click',()=>{
    const theme=document.getElementById('themeSel').value;
    const spd=parseInt(document.getElementById('spd').value,10)||0;
    const dir=parseInt(document.getElementById('dirSel').value,10);
    const seg=parseInt(document.getElementById('seg').value,10);
    pushHistory();
    addRing({theme, speed:spd, dir});
    toast('已新增：'+THEMES[theme].name);
  });

  // theme change -> suggest segment count + show/hide custom labels field
  document.getElementById('themeSel').addEventListener('change',(e)=>{
    const v=e.target.value;
    const t=THEMES[v];
    if(t.segs) document.getElementById('seg').value=t.segs;
    const cf=document.getElementById('customLabelsField');
    if(cf) cf.style.display = (v==='custom')?'block':'none';
  });

  // 自定义转速上限：改变所有滑杆量程（各环已设实际速度不变，仅重新映射）
  const maxSpeedInput=document.getElementById('maxSpeedInput');
  maxSpeedInput.addEventListener('change',()=>{
    let v=parseInt(maxSpeedInput.value,10);
    if(isNaN(v)) v=3600;
    v=Math.max(360, Math.min(SPEED_HARD_MAX, v));
    if(v!==SPEED_MAX) pushHistory();
    SPEED_MAX=v;
    maxSpeedInput.value=v;
    renderPanel();
    toast('转速上限已设为 '+v+'°/s');
  });

  // 全局字号倍率：统一缩放所有环文字（实时 input 更新显示，change 时存档）
  const gfRange=document.getElementById('globalFontRange');
  const gfVal=document.getElementById('globalFontVal');
  gfRange.addEventListener('input',()=>{
    GLOBAL_FONT_SCALE = parseFloat(gfRange.value)||1;
    if(gfVal) gfVal.textContent = Math.round(GLOBAL_FONT_SCALE*100)+'%';
  });
  gfRange.addEventListener('change',()=>{ saveState(); });

  /* toast：右下角浮动提示，1.4s 自动消失 */
  let toastTimer=null;
  const toastEl=document.getElementById('toast');
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1400);
  }

  /* keyboard：空格=播放/暂停，Ctrl+Z/Y=撤销/重做，F=全屏（输入框聚焦时不拦截，保留原生编辑） */
  window.addEventListener('keydown',(e)=>{
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    // 撤销/重做：输入框内不拦截（保留原生文本编辑）
    const t=e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
    else if(!e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase()==='f'){ e.preventDefault(); toggleFullscreen(); }
  });

  // 撤销/重做：顶部按钮已移除，仅保留快捷键 Ctrl+Z / Ctrl+Y（无按钮时跳过绑定）
  const btnUndo=document.getElementById('btnUndo'), btnRedo=document.getElementById('btnRedo');
  if(btnUndo) btnUndo.addEventListener('click',undo);
  if(btnRedo) btnRedo.addEventListener('click',redo);
  updateUndoBtns();

  /* ---------------- 右侧操作台：折叠 / 拖拽调宽 ---------------- */
  const asideEl=document.querySelector('aside');
  const resizerEl=document.getElementById('resizer');
  const panelToggleEl=document.getElementById('panelToggle');

  // 「展开顶栏」按钮始终贴在操作台左侧：面板展开时向左让出面板宽度，避免重叠
  // 触发时机：折叠/展开面板、拖拽调宽（实时）、顶栏收展、窗口缩放
  function syncHeaderShowPos(){
    const el=document.getElementById('headerShow');
    if(!el) return;
    const w = asideEl.classList.contains('collapsed') ? 0 : (asideEl.offsetWidth + 5);   // +5 = 拖拽条宽度
    el.style.right = (14 + w) + 'px';
  }

  /*
   * setPanelCollapsed：折叠/展开右侧操作台。
   * 宽度过渡为 0.18s：动画开始时 resize 一次，setTimeout 200ms + transitionend 再各校准一次，
   * 否则动画结束后画布比舞台小、两侧露出色差边。
   */
  function setPanelCollapsed(on){
    asideEl.classList.toggle('collapsed',on);
    resizerEl.style.display = on? 'none' : '';   // 收起时隐藏拖拽条
    panelToggleEl.textContent = on? '‹ 展开' : '▤ 面板';
    syncHeaderShowPos();
    requestAnimationFrame(()=>resize());   // 画布随可用宽度重算
    // 宽度有 .18s 过渡动画：动画结束后再校准一次，否则画布比舞台小、露出色差边
    if('TransitionEvent' in window){
      setTimeout(()=>{ resize(); syncHeaderShowPos(); },200);
      asideEl.addEventListener('transitionend',function once(){ asideEl.removeEventListener('transitionend',once); resize(); syncHeaderShowPos(); });
    }
  }
  panelToggleEl.addEventListener('click',()=>{
    setPanelCollapsed(!asideEl.classList.contains('collapsed'));
  });

  // 拖拽分隔条：240~640px，拖到 <200 自动折叠；拖拽时禁用宽度过渡避免迟滞，松手恢复
  let dragging=false;
  resizerEl.addEventListener('mousedown',(e)=>{
    if(asideEl.classList.contains('collapsed')) return;
    dragging=true; resizerEl.classList.add('dragging');
    asideEl.style.transition='none';            // 拖拽时禁用宽度过渡，避免迟滞
    const hs=document.getElementById('headerShow'); if(hs) hs.style.transition='none';   // 「⌄ 顶栏」同样跟手
    document.body.style.userSelect='none';      // 拖拽时禁止选中文字
    e.preventDefault();
  });
  window.addEventListener('mousemove',(e)=>{
    if(!dragging) return;
    const w=Math.max(0, window.innerWidth - e.clientX);
    if(w<200){ setPanelCollapsed(true); dragging=false; resizerEl.classList.remove('dragging'); document.body.style.userSelect=''; return; }
    const cw=Math.max(240, Math.min(640, w));
    asideEl.style.width=cw+'px';
    syncHeaderShowPos();                        // 拖动时实时跟随
  });
  window.addEventListener('mouseup',()=>{
    if(!dragging) return;
    dragging=false; resizerEl.classList.remove('dragging');
    asideEl.style.transition='';
    const hs=document.getElementById('headerShow'); if(hs) hs.style.transition='';
    document.body.style.userSelect='';
    resize(); syncHeaderShowPos();
  });

  /* ---------------- 左下角操作提示：隐藏 / 恢复 ---------------- */
  const hintEl=document.getElementById('hint');
  const hintShowEl=document.getElementById('hintShow');
  document.getElementById('hintClose').addEventListener('click',()=>{
    hintEl.style.display='none';
    hintShowEl.style.display='block';
  });
  hintShowEl.addEventListener('click',()=>{
    hintEl.style.display='';
    hintShowEl.style.display='none';
  });

  // 初始状态：右侧操作台与操作提示默认收起（HTML 已加 class/style，此处同步一次确保一致）
  setPanelCollapsed(true);

  /* ---------------- 顶栏收缩 / 展开 ---------------- */
  const headerEl=document.querySelector('header');
  const headerShowEl=document.getElementById('headerShow');
  const btnHeaderToggle=document.getElementById('btnHeaderToggle');
  function setHeaderCollapsed(on){
    headerEl.classList.toggle('collapsed',on);
    document.body.classList.toggle('hdr-collapsed',on);   // 供 CSS 下移「▤ 面板」按钮
    headerShowEl.style.display = on? 'block' : 'none';
    syncHeaderShowPos();
    btnHeaderToggle.textContent = on? '⌄ 展开顶栏' : '⌃ 收起顶栏';
    requestAnimationFrame(()=>resize());
  }
  btnHeaderToggle.addEventListener('click',()=>setHeaderCollapsed(!headerEl.classList.contains('collapsed')));
  headerShowEl.addEventListener('click',()=>setHeaderCollapsed(false));

  /* ---------------- 全屏显示（F 快捷键同款逻辑，带 webkit 回退） ---------------- */
  const btnFs=document.getElementById('btnFullscreen');
  function isFullscreen(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function toggleFullscreen(){
    if(isFullscreen()){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{
      const el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }
  }
  btnFs.addEventListener('click',toggleFullscreen);
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
    document.addEventListener(ev,()=>{
      const on=isFullscreen();
      btnFs.textContent = on? '⛶ 退出全屏' : '⛶ 全屏';
      requestAnimationFrame(()=>resize());   // 尺寸变化后重排画布
    })
  );

  /* ---------------- 启动 ---------------- */
  window.addEventListener('resize',()=>{ resize(); syncHeaderShowPos(); });
  // 关闭/切换标签前兜底存盘：即使只改了偏移角也保证最新状态落盘
  window.addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveState(); });
  resize();
  booted = true;          // 启动完成：此后每次修改都会自动存盘
  renderPanel();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
